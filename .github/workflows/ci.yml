name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# 同じブランチに続けてpushしたときは、古い実行を取り消して最新のコミットだけを確認する
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: API test
    runs-on: ubuntu-latest
    # テスト用DB(kintai_hub_test)はglobal-setupが自動で作成・マイグレーションする。
    # 接続先は apps/api/src/test/database-url.ts の既定値(docker-compose.yml と同じ認証情報)に合わせる
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kintai_hub
          POSTGRES_USER: kintai
          POSTGRES_PASSWORD: kintai_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kintai -d kintai_hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test -w @kintai/api
