#   npx wrangler secret put RESEND_API_KEY
#   npx wrangler secret put UPSTASH_REDIS_REST_TOKEN
#   npx wrangler secret put STRIPE_SECRET_KEY
#   npx wrangler secret put STRIPE_WEBHOOK_SECRET
#   npx wrangler secret put STRIPE_PRICE_STANDARD
#   npx wrangler secret put STRIPE_PRICE_PRO

# `npx wrangler hyperdrive create kintai-hub-db --connection-string="<Neonの接続文字列>"`
# の出力される id をここに貼る
# localConnectionString: `wrangler dev`（ローカル実行）時だけ使われる。Cloudflareの本番Hyperdriveは
# 経由せず、docker-composeのローカルPostgresに直接つなぐ
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fae695ea986b4f0b870db37073d28cf1"
localConnectionString = "postgresql://kintai:kintai_pass@localhost:5432/kintai_hub"
